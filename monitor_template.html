<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track and overhead line against limits</title>
<style>
  :root { --bg:#eef3f4; --card:#fff; --ink:#172126; --muted:#66777d; --teal:#0f8b8d; --teal-dark:#0b5f61; --amber:#e8a317; --red:#c62828; --line:#e1e8ea; --dark:#0b1f26; --dark2:#113a42; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 "Segoe UI", Calibri, system-ui, sans-serif; }
  header { background:linear-gradient(110deg, var(--dark) 0%, var(--dark2) 100%); color:#fff; padding:26px 40px 22px; }
  .wrap { max-width:1380px; margin:0 auto; }
  header h1 { margin:0; font-size:26px; font-weight:600; }
  header .lead { color:#dbe9eb; font-size:15px; margin-top:6px; max-width:960px; }
  header .sub { color:#8fb3b8; font-size:12px; margin-top:8px; }
  .tabs { display:flex; gap:8px; margin-top:18px; flex-wrap:wrap; }
  .tabs button { font:inherit; font-size:13.5px; padding:8px 16px; border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.06); border-radius:999px; color:#dbe9eb; cursor:pointer; }
  .tabs button.on { background:#fff; border-color:#fff; color:var(--dark); font-weight:600; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:12px; margin-top:18px; }
  .kpi { background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:12px 14px 10px; }
  .kpi .num { font-size:26px; font-weight:600; line-height:1.1; color:#fff; font-variant-numeric:tabular-nums; }
  .kpi .num small { font-size:14px; font-weight:500; color:#a6c8cc; margin-left:3px; }
  .kpi .lab { font-size:12.5px; color:#fff; margin-top:4px; font-weight:600; }
  .kpi .sub { font-size:11.5px; color:#a6c8cc; margin-top:2px; }
  .kpi.red .num { color:#ff8a80; } .kpi.amber .num { color:#ffd54f; }
  main { padding:18px 40px 56px; }
  .card { background:var(--card); border-radius:14px; padding:18px 20px 16px; box-shadow:0 1px 2px rgba(23,33,38,.06), 0 6px 20px rgba(23,33,38,.05); }
  .card h3 { margin:0 0 4px; font-size:15.5px; font-weight:600; }
  .card .hint { margin:0 0 10px; color:var(--muted); font-size:13px; max-width:960px; }
  .mt { margin-top:18px; }
  .row { display:grid; gap:18px; } .cols-2 { grid-template-columns:1.4fr 1fr; }
  .controls { display:flex; gap:22px; flex-wrap:wrap; align-items:flex-end; }
  .ctl label { display:block; color:var(--muted); font-size:12px; letter-spacing:.04em; text-transform:uppercase; margin-bottom:4px; }
  select { font:inherit; font-size:13px; padding:6px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); max-width:100%; }
  .chips { display:flex; gap:10px; flex-wrap:wrap; }
  .chips label { display:inline-flex; gap:6px; align-items:center; font-size:13px; text-transform:none; letter-spacing:0; color:var(--ink); padding:6px 10px; border:1px solid var(--line); border-radius:999px; cursor:pointer; }
  .chips label:has(input:checked) { background:#fff5dc; border-color:#f0c660; }
  .slider { display:grid; grid-template-columns:1fr auto; gap:14px; align-items:center; margin:8px 0 12px; }
  input[type=range] { width:100%; accent-color:var(--teal); }
  .readout { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px 18px; }
  .ro .v { font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; } .ro .k { color:var(--muted); font-size:12.5px; }
  .badge { display:inline-block; padding:4px 12px; border-radius:999px; font-size:12px; font-weight:700; color:#fff; letter-spacing:.04em; }
  .badge.ok { background:var(--teal); } .badge.rule { background:var(--amber); color:#3a2a00; } .badge.limit { background:var(--red); } .badge.na { background:#9aa9ae; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; font-variant-numeric:tabular-nums; }
  th, td { text-align:right; padding:7px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th:first-child, td:first-child, th.l, td.l { text-align:left; }
  th { color:var(--muted); font-weight:600; font-size:11.5px; letter-spacing:.04em; text-transform:uppercase; position:sticky; top:0; background:#fff; }
  tr.pick { cursor:pointer; } tr.pick:hover td { background:#f3f8f8; }
  .scroll { max-height:360px; overflow:auto; border:1px solid var(--line); border-radius:10px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle; }
  .notes p { margin:6px 0; } .notes b { color:var(--teal-dark); }
  .muted { color:var(--muted); }
  iframe { width:100%; height:640px; border:1px solid var(--line); border-radius:10px; background:#fff; }
  @media (max-width: 1000px) { .cols-2 { grid-template-columns:1fr; } header, main { padding-left:18px; padding-right:18px; } }
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Track and overhead line against limits</h1>
  <div class="lead">One LiDAR scan, one curve of the track. The gauge of the rails and the height and stagger of the contact wire are read along the chainage and compared with reference limits.</div>
  <div class="sub" id="prov"></div>
  <div class="tabs" id="tabs"></div>
  <div class="kpis" id="kpis"></div>
</div></header>
<main class="wrap">
  <div id="paramView">
    <!--PANEL--><div id="panel">
    <div class="card mt">
      <h3 id="settingsTitle">Settings</h3>
      <p class="hint" id="whatText"></p>
      <div class="controls">
        <div class="ctl"><label for="cls">Reference limits</label><select id="cls"></select></div>
        <div class="ctl"><label for="series">Points of the chart</label><select id="series"></select></div>
        <div class="ctl"><label for="minlen">Ignore stretches shorter than</label><select id="minlen"><option value="0">nothing</option><option value="1" selected>1 m</option><option value="2">2 m</option><option value="5">5 m</option></select></div>
        <div class="ctl"><label for="yscale">Vertical scale</label><select id="yscale"><option value="fit">fit the track</option><option value="limits">show both limits</option></select></div>
      </div>
    </div>
    <div class="card mt"><h3 id="chartTitle"></h3><p class="hint" id="chartHint"></p><div id="chart"></div></div>
    <div class="card mt" id="view3d">
      <h3 id="view3dTitle">The curve in 3D</h3><p class="hint" id="view3dHint"></p>
      <iframe id="view3dFrame" loading="lazy" title="3D view" style="display:none"></iframe>
      <div id="mini3d" style="display:none"></div>
    </div>
    <div class="card mt"><h3>Flagged stretches</h3><p class="hint" id="tableHint"></p><div class="scroll" id="stretches"></div></div>
    <div class="card mt notes" id="notes"></div>
    </div><!--/PANEL-->
  </div>
</main>

<script>/*PLOTLY*/</script>
<script>
const D = /*DATA*/null;
const el = id => document.getElementById(id);
const TEAL = '#0f8b8d', AMBER = '#e8a317', RED = '#c62828', INK = '#172126', MUTED = '#66777d', GRID = '#eef2f3';
const STATE_COLOURS = ['#0f8b8d', '#e07a1f', '#6f5aa8', '#8a7a66', '#2b6cb0'];
const CFG = {responsive: true, displaylogo: false, modeBarButtonsToRemove: ['lasso2d', 'select2d', 'autoScale2d']};
const FONT = {family: '"Segoe UI", Calibri, system-ui, sans-serif', size: 12, color: INK};
const fmt = (v, n) => v == null || !isFinite(v) ? '–' : (+v).toFixed(n);
const sign = (v, n) => v == null || !isFinite(v) ? '–' : (v > 0 ? '+' : '') + (+v).toFixed(n);
const axis = extra => Object.assign({gridcolor: GRID, zerolinecolor: '#d8e0e2', linecolor: '#d8e0e2', tickfont: {size: 11, color: MUTED}, ticks: ''}, extra || {});
const title = text => ({text, font: {size: 11.5, color: MUTED}});
const WORDS = {gauge: ['tightest', 'widest'], wire_height: ['lowest', 'highest'], wire_stagger: ['furthest right (−)', 'furthest left (+)']};

el('prov').textContent = `Run ${D.run.id} · ${D.run.file} · ${D.run.points.toLocaleString('en')} points · ${D.run.length_m} m · reference line ${D.run.reference} · pipeline ${D.run.code} · page made ${D.generated}`;

// ---------------------------------------------------------------- tabs and panels
// A tab shows one or two quantities, each in its own panel (the page holds two copies of the panel markup, the second
// with every id suffixed "_2"). The rendering functions below work on the globals P, S, cur and SFX, which withPanel()
// swaps in for the panel being drawn.
const wireKeys = D.params.filter(p => p.key.startsWith('wire_')).map(p => p.key);
const TABS = [{key: 'gauge', label: 'Gauge', params: ['gauge']}].filter(t => D.params.some(p => p.key === 'gauge'))
  .concat(wireKeys.length ? [{key: 'wire', label: 'Contact wire', params: wireKeys}] : []);
const newState = () => ({cls: 0, series: 'm1', centre: 'mean', sigma: 'std', minlen: 1, yscale: 'fit', rules: new Set(), pos: 0});   // rules: the control-chart rules are kept in the code but switched off and not shown
const PANELS = [{sfx: '', P: null, S: newState(), cur: null}, {sfx: '_2', P: null, S: newState(), cur: null}];
let P = D.params[0], S = PANELS[0].S, cur = null, SFX = '', TAB = TABS[0].key;
const pel = id => el(id + SFX);
function withPanel(i, fn) {
  const prev = {SFX, P, S, cur}, pn = PANELS[i];
  SFX = pn.sfx; P = pn.P; S = pn.S; cur = pn.cur;
  try { fn(); pn.cur = cur; } finally { SFX = prev.SFX; P = prev.P; S = prev.S; cur = prev.cur; }
}
el('tabs').innerHTML = TABS.map(t => `<button data-k="${t.key}" class="${t.key === TAB ? 'on' : ''}">${t.label}</button>`).join('');
el('tabs').onclick = e => { const b = e.target.closest ? e.target.closest('button') : null; if (!b) return; showTab(b.dataset.k); };
function showTab(key) {
  TAB = key;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.k === key));
  const t = TABS.find(x => x.key === key);
  PANELS.forEach((pn, i) => {
    const pkey = t.params[i], node = el('panel' + pn.sfx);
    if (!pkey) { pn.P = null; pn.cur = null; node.style.display = 'none'; return; }
    node.style.display = '';
    pn.P = D.params.find(p => p.key === pkey); pn.S = newState(); pn.S.cls = pn.P.default_limit || 0; pn.S.series = pn.P.base.step < 1 ? 'm1' : 'base';
    withPanel(i, () => { initPanel(); refresh(); });
  });
  renderKpis();
}
function initPanel() {                                             // the menus and titles of the panel for its quantity P
  const levelText = c => c.levels.map(l => `${l.name} ${l.min == null ? '' : fmt(l.min, P.decimals)}${l.min != null && l.max != null ? '–' : ''}${l.max == null ? '' : fmt(l.max, P.decimals)}`).join(' · ') + ' ' + P.unit;
  const groups = [...new Set(P.limits.map(c => c.group || ''))];
  pel('cls').innerHTML = groups.map(gname => `<optgroup label="${gname}">` + P.limits.map((c, i) => (c.group || '') === gname ? `<option value="${i}" ${i === S.cls ? 'selected' : ''}>${c.name}: ${levelText(c)}</option>` : '').join('') + '</optgroup>').join('');
  const opts = P.base.step < 1 ? [['base', `every ${P.base.name} (raw)`], ['m1', `1 m stretches (mean of ${Math.round(1 / P.base.step)} slabs)`]] : [['base', `every ${P.base.name} (as measured)`]];
  opts.push(['m2', `2 m stretches (mean of ${Math.round(2 / P.base.step)} points)`], ['m5', `5 m stretches (mean of ${Math.round(5 / P.base.step)} points)`]);
  if (P.base.step < 1) opts.push(['m100', '100 m sliding mean, every metre (for the Trafikverket 100 m limits)']);
  if (P.ctrl) opts.push(['ctrl', P.ctrl.name]);
  pel('series').innerHTML = opts.map(o => `<option value="${o[0]}" ${o[0] === S.series ? 'selected' : ''}>${o[1]}</option>`).join('');
  pel('minlen').value = String(S.minlen); pel('yscale').value = S.yscale;
  pel('settingsTitle').textContent = `Settings · ${P.label}`; pel('whatText').textContent = `${P.label}: ${P.what}.`;
  pel('chartTitle').textContent = `${P.label} along the chainage`;
}

// ---------------------------------------------------------------- the series and the limits
function pointNoise(base) {                                        // point-to-point noise of the raw series: scatter of neighbouring differences / sqrt(2)
  const d = []; for (let i = 1; i < base.v.length; i++) { const a = base.v[i - 1], b = base.v[i]; if (a != null && b != null) d.push(b - a); }
  if (d.length < 3) return NaN;
  const m = d.reduce((x, y) => x + y, 0) / d.length; return Math.sqrt(d.reduce((x, y) => x + (y - m) ** 2, 0) / d.length) / Math.SQRT2;
}
function blockMeans(base, L) {
  const s = [], g = [], step = base.step, need = Math.max(1, Math.round(0.5 * L / step));
  let k0 = Math.floor(base.s[0] / L), acc = [];
  const flush = k => { s.push((k + 0.5) * L); g.push(acc.length >= need ? acc.reduce((a, b) => a + b, 0) / acc.length : null); acc = []; };
  for (let i = 0; i < base.s.length; i++) { const k = Math.floor(base.s[i] / L); while (k > k0) { flush(k0); k0++; } if (base.v[i] != null) acc.push(base.v[i]); }
  flush(k0);
  return {s, g, L};
}
function slidingMean(base, L, stepOut) {                            // mean over a window of L metres, centred every stepOut metres, where at least 80 % of the window is measured
  const s = [], g = [], need = 0.8 * L / base.step;
  for (let c = Math.ceil((base.s[0] + L / 2) / stepOut) * stepOut; c <= base.s[base.s.length - 1] - L / 2; c += stepOut) {
    let sum = 0, n = 0;
    for (let i = 0; i < base.s.length; i++) { if (base.s[i] < c - L / 2) continue; if (base.s[i] >= c + L / 2) break; if (base.v[i] != null) { sum += base.v[i]; n++; } }
    s.push(c); g.push(n >= need ? sum / n : null);
  }
  return {s, g};
}
function compute() {
  let s, g, nPer, step;
  if (S.series === 'base') { s = P.base.s; g = P.base.v; nPer = 1; step = P.base.step; }
  else if (S.series === 'ctrl') { s = P.ctrl.s; g = P.ctrl.v; nPer = Math.round(P.ctrl.step / P.base.step); step = P.ctrl.step; }
  else if (S.series === 'm100') { const b = slidingMean(P.base, 100, 1); s = b.s; g = b.g; nPer = Math.round(100 / P.base.step); step = 1; }
  else { const L = +S.series.slice(1), b = blockMeans(P.base, L); s = b.s; g = b.g; nPer = Math.round(L / P.base.step); step = L; }
  const valid = g.map((v, i) => v != null && isFinite(v) ? i : -1).filter(i => i >= 0), vals = valid.map(i => g[i]).sort((a, b) => a - b);
  const mean = vals.reduce((a, b) => a + b, 0) / vals.length, med = vals[Math.floor(vals.length / 2)];
  const sd = Math.sqrt(vals.reduce((a, b) => a + (b - mean) ** 2, 0) / vals.length);
  const mad = (() => { const d = vals.map(v => Math.abs(v - med)).sort((a, b) => a - b); return 1.4826 * d[Math.floor(d.length / 2)]; })();
  const noise = pointNoise(P.base) / Math.sqrt(nPer);
  const centre = S.centre === 'mean' ? mean : P.nominal, sigma = S.sigma === 'std' ? sd : S.sigma === 'mad' ? mad : noise;
  // the limits: one or more levels, ordered from the first to act on (e.g. PLAN) to the most severe (KRIT); a point's level is the most severe one it exceeds
  const lim = P.limits[S.cls], levels = lim.levels, first = levels[0], last = levels[levels.length - 1];
  const lo = first.min, hi = first.max;
  const level = g.map(v => { if (v == null || !isFinite(v)) return -1; let L = -1; levels.forEach((lv, j) => { if ((lv.min != null && v < lv.min) || (lv.max != null && v > lv.max)) L = j; }); return L; });
  const levelCount = levels.map((lv, j) => level.filter(L => L >= j).length);
  const z = g.map(v => v == null || !isFinite(v) ? null : (v - centre) / sigma);
  // Western Electric rules; zones A (2σ–3σ), B (1σ–2σ), C (within 1σ). All four always evaluated; only the selected mark the chart.
  const hitAll = new Array(g.length).fill(0), win = [];
  for (let i = 0; i < g.length; i++) {
    if (z[i] == null) continue;
    win.push(i); if (win.length > 8) win.shift();
    const last = k => win.slice(-k).map(j => z[j]);
    if (Math.abs(z[i]) > 3) hitAll[i] |= 1;
    if (win.length >= 3) { const w = last(3); if (w.filter(v => v > 2).length >= 2 || w.filter(v => v < -2).length >= 2) hitAll[i] |= 2; }
    if (win.length >= 5) { const w = last(5); if (w.filter(v => v > 1).length >= 4 || w.filter(v => v < -1).length >= 4) hitAll[i] |= 4; }
    if (win.length >= 8) { const w = last(8); if (w.every(v => v > 0) || w.every(v => v < 0)) hitAll[i] |= 8; }
  }
  const mask = (S.rules.has(1) ? 1 : 0) | (S.rules.has(2) ? 2 : 0) | (S.rules.has(3) ? 4 : 0) | (S.rules.has(4) ? 8 : 0);
  let hit = hitAll.map(h => h & mask);
  const ruleCount = [1, 2, 4, 8].map(b => hitAll.filter(h => h & b).length);
  const zoneShare = [0, 0, 0, 0];
  z.forEach(v => { if (v == null) return; const a = Math.abs(v); zoneShare[a < 1 ? 0 : a < 2 ? 1 : a < 3 ? 2 : 3]++; });
  const outside = level.map(L => L >= 0);
  const gapN = Math.max(1, Math.round(1.0 / step));
  let stretches = [];
  for (const kind of ['limit', 'rule']) {
    let open = null, lastIdx = -1e9;
    for (let i = 0; i < g.length; i++) {
      const on = kind === 'limit' ? outside[i] : hit[i] > 0;
      if (!on) continue;
      if (open && i - lastIdx <= gapN) open.to = i; else { if (open) stretches.push(open); open = {kind, from: i, to: i}; }
      lastIdx = i;
    }
    if (open) stretches.push(open);
  }
  const minN = Math.ceil(S.minlen / step - 1e-9);
  stretches = stretches.filter(st => st.kind === 'limit' || st.to - st.from + 1 >= minN);
  const keep = new Array(g.length).fill(false);
  stretches.filter(st => st.kind === 'rule').forEach(st => { for (let i = st.from; i <= st.to; i++) keep[i] = true; });
  hit = hit.map((h, i) => keep[i] ? h : 0);
  stretches.forEach(st => {
    const idx = []; for (let i = st.from; i <= st.to; i++) if (g[i] != null) idx.push(i);
    const dev = idx.map(i => g[i] - centre), k = idx[dev.map(Math.abs).indexOf(Math.max(...dev.map(Math.abs)))];
    st.s0 = s[st.from]; st.s1 = s[st.to]; st.peak_i = k; st.peak = g[k];
    st.rules = [...new Set(idx.flatMap(i => [1, 2, 4, 8].filter(b => hit[i] & b).map(b => ({1: 1, 2: 2, 4: 3, 8: 4}[b]))))].sort();
    st.level = st.kind === 'limit' ? Math.max(...idx.map(i => level[i])) : -1;
  });
  stretches.sort((a, b) => a.s0 - b.s0);
  // flags of the measurement itself (e.g. two wires side by side), mapped onto the points of the chart
  const flagged = new Array(g.length).fill(false);
  if (P.flags) P.flags.s.forEach(fs => { let best = 0, bd = 1e9; s.forEach((v, i) => { const d = Math.abs(v - fs); if (d < bd) { bd = d; best = i; } }); if (bd <= step / 2 + 1e-9) flagged[best] = true; });
  cur = {s, g, z, hit, hitAll, ruleCount, zoneShare, outside, level, levels, levelCount, stretches, flagged, centre, sigma, mean, sd, mad, noise, nPer, lo, hi, lim, step,
         outerLo: last.min, outerHi: last.max, nOutside: outside.filter(Boolean).length, nHit: hit.filter(h => h > 0).length, nValid: vals.length, dmin: vals[0], dmax: vals[vals.length - 1]};
}
// colours of the limit levels, from the first to act on to the most severe
function levelColours(n) { return n === 1 ? [RED] : n === 2 ? ['#e07a1f', RED] : n === 3 ? ['#f2b35c', '#e07a1f', RED] : ['#f2b35c', '#e07a1f', RED, '#7b1113']; }

// ---------------------------------------------------------------- header numbers
function kpis(compact) {                                           // returns the tiles' HTML; compact = two quantities share the header
  const c = cur, d = P.decimals, u = P.unit, w = WORDS[P.key] || ['lowest', 'highest'], q = P.short.toLowerCase();
  const K = compact ? [
    {num: `${sign(c.mean - P.nominal, d)}<small>${u}</small>`, lab: `mean ${q}, from the nominal ${fmt(P.nominal, d)} ${u}`, sub: `${fmt(c.mean, d)} ${u} · from ${fmt(c.dmin, d)} to ${fmt(c.dmax, d)} ${u} · ${c.nValid} points`},
    {num: c.nOutside, lab: `${q}: points beyond ${c.levels.length > 1 ? c.levels[0].name : 'the limits'}`, sub: `${c.lim.name} · ${c.stretches.filter(x => x.kind === 'limit').length} stretches`, cls: c.nOutside ? 'red' : ''},
    {num: `${Math.round(100 * (c.nValid - c.nOutside) / c.nValid)}<small>%</small>`, lab: `${q}: within ${c.levels.length > 1 ? c.levels[0].name : 'the limits'}`, sub: `${c.nValid - c.nOutside} of ${c.nValid} points`}] : [
    {num: `${sign(c.mean - P.nominal, d)}<small>${u}</small>`, lab: `mean ${P.short.toLowerCase()}, from the nominal ${fmt(P.nominal, d)} ${u}`, sub: `${fmt(c.mean, d)} ${u} · spread ± ${fmt(c.sd, d)} ${u} · ${c.nValid} points`},
    {num: `${fmt(c.dmin, d)}<small>${u}</small>`, lab: `${w[0]} point shown`, sub: c.lo != null ? `${sign(c.dmin - c.lo, d)} ${u} against the ${c.levels[0].name} minimum of ${fmt(c.lo, d)} ${u}` : 'the chosen limits have no minimum'},
    {num: `${fmt(c.dmax, d)}<small>${u}</small>`, lab: `${w[1]} point shown`, sub: c.hi != null ? `${sign(c.hi - c.dmax, d)} ${u} below the ${c.levels[0].name} maximum of ${fmt(c.hi, d)} ${u}` : 'the chosen limits have no maximum'},
    {num: c.nOutside, lab: c.levels.length > 1 ? `points beyond ${c.levels[0].name}` : 'points outside the limits', sub: c.levels.length > 1 ? c.levels.map((lv, j) => `${lv.name} ${c.levelCount[j]}`).join(' · ') + ` · ${c.stretches.filter(x => x.kind === 'limit').length} stretches` : `${c.lim.name} · ${c.stretches.filter(x => x.kind === 'limit').length} stretches`, cls: c.nOutside ? 'red' : ''},
    {num: `${Math.round(100 * (c.nValid - c.nOutside) / c.nValid)}<small>%</small>`, lab: c.levels.length > 1 ? `of points within ${c.levels[0].name}` : 'of points within the limits', sub: `${c.nValid - c.nOutside} of ${c.nValid} points`}];
  return K.map(k => `<div class="kpi ${k.cls || ''}"><div class="num">${k.num}</div><div class="lab">${k.lab}</div><div class="sub">${k.sub}</div></div>`).join('');
}

// ---------------------------------------------------------------- the chart
function chart() {
  const c = cur, s = c.s, g = c.g, d = P.decimals, u = P.unit;
  const seriesName = S.series === 'base' ? `${P.short.toLowerCase()}, every ${P.base.name}` : S.series === 'ctrl' ? `${P.short.toLowerCase()} at the ${P.ctrl.name}s` : `${P.short.toLowerCase()}, mean per ${S.series.slice(1)} m stretch`;
  const LC = levelColours(c.levels.length);
  const traces = [
    {type: 'scattergl', mode: 'lines+markers', x: s, y: g, name: seriesName, line: {color: TEAL, width: 1.4}, marker: {size: c.step < 1 ? 2 : 4, color: TEAL}, hovertemplate: `%{x:.2f} m: %{y:.${d}f} ${u}<extra></extra>`}];
  c.levels.forEach((lv, j) => {                                   // points drawn by the most severe level they exceed
    const idx = []; c.level.forEach((L, i) => { if (L === j) idx.push(i); });
    traces.push({type: 'scattergl', mode: 'markers', x: idx.length ? idx.map(i => s[i]) : [null], y: idx.length ? idx.map(i => g[i]) : [null], name: c.levels.length > 1 ? `beyond ${lv.name} (${c.levelCount[j]})` : 'outside the limits',
      marker: {color: LC[j], size: 7 + 2 * j, line: {color: '#fff', width: 1}}, hovertemplate: `%{x:.2f} m: %{y:.${d}f} ${u}, beyond ${lv.name}<extra></extra>`});
  });
  if (P.flags) { const idx = []; c.flagged.forEach((f, i) => { if (f && g[i] != null) idx.push(i); });
    traces.push({type: 'scattergl', mode: 'markers', x: idx.map(i => s[i]), y: idx.map(i => g[i]), name: P.flags.name, marker: {symbol: 'x', color: MUTED, size: 7}, hovertemplate: `%{x:.2f} m: ${P.flags.name}<extra></extra>`}); }
  const shapes = [];
  shapes.push({type: 'line', xref: 'paper', x0: 0, x1: 1, yref: 'y', y0: P.nominal, y1: P.nominal, line: {color: '#9fb0b5', width: 1, dash: 'dash'}});
  c.levels.forEach((lv, j) => [lv.min, lv.max].forEach(y => { if (y != null) shapes.push({type: 'line', xref: 'paper', x0: 0, x1: 1, yref: 'y', y0: y, y1: y, line: {color: LC[j], width: j === c.levels.length - 1 ? 1.8 : 1.2, dash: c.levels.length > 1 && j < c.levels.length - 1 ? 'dot' : 'solid'}}); }));
  c.stretches.forEach(st => shapes.push({type: 'rect', xref: 'x', x0: st.s0 - c.step / 2, x1: st.s1 + c.step / 2, yref: 'paper', y0: 0, y1: 1,
    fillcolor: st.kind === 'limit' ? 'rgba(198,40,40,0.12)' : 'rgba(232,163,23,0.16)', line: {width: 0}, layer: 'below'}));
  const pad = Math.max(3 * c.sigma, 0.1 * (c.dmax - c.dmin) || 1);
  const allLimits = c.levels.flatMap(lv => [lv.min, lv.max]).filter(v => v != null);
  let ymin, ymax;
  if (S.yscale === 'limits') { ymin = Math.min(c.dmin, P.nominal, ...allLimits) - pad / 3; ymax = Math.max(c.dmax, P.nominal, ...allLimits) + pad / 3; }
  else { ymin = Math.min(c.dmin, P.nominal) - pad; ymax = Math.max(c.dmax, P.nominal) + pad; }
  const ann = [{xref: 'paper', x: 1, xanchor: 'right', yref: 'y', y: P.nominal, yanchor: 'bottom', showarrow: false, text: `nominal ${fmt(P.nominal, d)} ${u}`, font: {size: 11, color: MUTED}},
               {xref: 'paper', x: 0.005, xanchor: 'left', yref: 'paper', y: 0.01, yanchor: 'bottom', showarrow: false, bgcolor: 'rgba(255,255,255,0.85)', text: `mean ${fmt(c.mean, d)} ${u} · scatter ± ${fmt(c.sd, d + 1)} ${u}`, font: {size: 11, color: TEAL}}];
  const limitNote = (y, text, above, col) => (y >= ymin && y <= ymax)
    ? ann.push({xref: 'paper', x: 1, xanchor: 'right', yref: 'y', y, yanchor: above ? 'bottom' : 'top', showarrow: false, text, font: {size: 10.5, color: col}})
    : null;
  const offView = [];                                               // levels that lie outside the view are listed in one note at the edge
  c.levels.forEach((lv, j) => {
    const name = c.levels.length > 1 ? lv.name : c.lim.name;
    if (lv.max != null) { if (!limitNote(lv.max, `${name} max ${fmt(lv.max, d)}`, true, LC[j])) offView.push(`${name} max ${fmt(lv.max, d)} ${u}`); }
    if (lv.min != null) { if (!limitNote(lv.min, `${name} min ${fmt(lv.min, d)}`, false, LC[j])) offView.push(`${name} min ${fmt(lv.min, d)} ${u}`); }
  });
  if (offView.length) ann.push({xref: 'paper', x: 1, xanchor: 'right', yref: 'paper', y: 1, yanchor: 'top', showarrow: false, text: 'outside this view: ' + offView.join(', '), font: {size: 10.5, color: RED}, bgcolor: 'rgba(255,255,255,0.85)'});
  const layout = {paper_bgcolor: '#fff', plot_bgcolor: '#fff', font: FONT, height: 500, margin: {l: 64, r: 20, t: 16, b: 48}, hovermode: 'closest', shapes, annotations: ann,
    legend: {orientation: 'h', x: 1, xanchor: 'right', y: 1.08, font: {size: 11.5}},
    xaxis: axis({title: title('chainage along the track (m)'), rangeslider: {thickness: 0.06, bgcolor: '#f6f9f9'}}), yaxis: axis({title: title(`${P.label} (${u})`), range: [ymin, ymax]})};
  Plotly.newPlot('chart' + SFX, traces, layout, CFG);
  pel('chartHint').textContent = `Teal: ${seriesName}. ${c.levels.length > 1 ? `Limit lines: ${c.lim.name}, from ${c.levels[0].name} (dotted, light) to ${c.levels[c.levels.length - 1].name} (solid, dark)` : `Red lines: the ${c.lim.name} limits`}. Dashed grey: the nominal value. ` +
    `Larger markers are coloured by the most severe limit level a point exceeds; the legend counts them. Red shading: a stretch beyond a limit.` + (P.flags ? ` Grey crosses: ${P.flags.name}.` : '') + ` Drag below the chart to zoom; double-click to reset.`;
}

function view3d() {
  const card = pel('view3d'), frame = pel('view3dFrame'), mini = pel('mini3d');
  if (P.key === 'gauge' && D.views.run) {
    card.style.display = ''; frame.src = frame.src || D.views.run; frame.style.display = ''; mini.style.display = 'none';
    pel('view3dTitle').textContent = 'The curve in 3D';
    pel('view3dHint').innerHTML = `The run as a 3D curve of both rails. Set "Colour the rails by" to gauge to see tight and wide stretches on the track itself; tick "Contact wire" under Show to draw the wire along the top of the box (its sideways zigzag is true, its height is the colour); the Window and Cursor of the viewer use the same chainage as the chart. <a href="${D.views.run}" target="_blank">Open it in its own tab</a>.`;
  } else if (D.wire3d && SFX === '') {                              // one 3D picture for the wire tab, under the first of its two charts
    card.style.display = ''; frame.style.display = 'none'; mini.style.display = '';
    pel('view3dTitle').textContent = 'The rails and the contact wire in 3D';
    pel('view3dHint').textContent = 'Track frame: chainage along, sideways across, height up (true metres, the along-track axis compressed). The wire zigzags over the track centre and rides about 5.6 m above the rails; its colour is its height. Drag to turn, scroll to zoom.';
    const w = D.wire3d, zero = w.s.map(() => 0);
    const wireColour = P.key === 'wire_stagger' ? w.wd : w.wh;
    Plotly.newPlot('mini3d' + SFX, [
      {type: 'scatter3d', mode: 'lines', x: w.s, y: w.dL, z: w.zL, name: 'left rail', line: {color: '#D9822B', width: 4}, hoverinfo: 'skip'},
      {type: 'scatter3d', mode: 'lines', x: w.s, y: w.dR, z: w.zR, name: 'right rail', line: {color: '#028090', width: 4}, hoverinfo: 'skip'},
      {type: 'scatter3d', mode: 'lines', x: w.s, y: zero, z: zero, name: 'track centre', line: {color: '#9fb0b5', width: 2, dash: 'dash'}, hoverinfo: 'skip'},
      {type: 'scatter3d', mode: 'lines+markers', x: w.ws, y: w.wd, z: w.wh, name: 'contact wire', marker: {size: 2.5, color: wireColour, colorscale: 'Viridis', colorbar: {title: {text: P.key === 'wire_stagger' ? 'sideways (m)' : 'height (m)', font: {size: 11}}, thickness: 10, len: 0.6}},
       line: {color: '#333', width: 3}, hovertemplate: 's %{x:.1f} m · sideways %{y:.3f} m · height %{z:.3f} m<extra>contact wire</extra>'}],
      {paper_bgcolor: '#fff', font: FONT, height: 520, margin: {l: 0, r: 0, t: 10, b: 0}, legend: {orientation: 'h', x: 0, y: 1, font: {size: 11.5}},
       scene: {aspectmode: 'manual', aspectratio: {x: 5, y: 1, z: 1.4}, camera: {eye: {x: -2.6, y: -2.4, z: 0.9}, center: {x: 0, y: 0, z: -0.1}},
               xaxis: {title: 'chainage s (m)', gridcolor: GRID}, yaxis: {title: 'sideways (m)', gridcolor: GRID, range: [-1.5, 1.5]}, zaxis: {title: 'height above rail (m)', gridcolor: GRID}}}, CFG);
  } else card.style.display = 'none';
}

function table() {
  const c = cur, st = c.stretches, d = P.decimals, u = P.unit;
  const LC = levelColours(c.levels.length);
  pel('tableHint').textContent = st.length ? `${st.length} stretches of ${P.label.toLowerCase()} beyond a level of the ${c.lim.name} limits; the most severe level reached is named.` :
    `No point of ${P.label.toLowerCase()} is beyond the ${c.lim.name} limits.`;
  pel('stretches').innerHTML = st.length ? '<table><tr><th class="l">Kind</th><th>From</th><th>To</th><th>Length</th><th>Extreme value</th><th>From nominal</th><th>From the mean</th></tr>' +
    st.map(x => `<tr><td class="l"><span class="dot" style="background:${x.kind === 'limit' ? LC[x.level] : AMBER}"></span>${x.kind === 'limit' ? (c.levels.length > 1 ? 'beyond ' + c.levels[x.level].name : 'outside the limits') : 'flagged'}</td>` +
      `<td>${fmt(x.s0, 1)} m</td><td>${fmt(x.s1, 1)} m</td><td>${fmt(x.s1 - x.s0 + c.step, 1)} m</td><td>${fmt(x.peak, d)} ${u}</td><td>${sign(x.peak - P.nominal, d)} ${u}</td><td>${sign(x.peak - c.mean, d)} ${u}</td></tr>`).join('') + '</table>' : '';
}

function notes() {
  const c = cur, d = P.decimals, u = P.unit;
  pel('notes').innerHTML = `<h3>How to read this: ${P.label.toLowerCase()}</h3>
<p><b>${P.label}</b> is ${P.what}. ${P.key === 'gauge' ? 'Height is not used, so the sensor-relative height of the scan does not matter here.' : 'It is measured against the rails in the same cross-section, so the sensor-relative height of the scan cancels out.'}</p>
<p><b>The limits</b> are ${P.limits_text}</p>
<p><b>Selected now: ${c.lim.name}.</b> ${c.lim.note}. ${c.levels.map(lv => `<b>${lv.name}</b>${lv.min != null || lv.max != null ? ` (${lv.min != null ? 'min ' + fmt(lv.min, d) : ''}${lv.min != null && lv.max != null ? ', ' : ''}${lv.max != null ? 'max ' + fmt(lv.max, d) : ''} ${u})` : ''}: ${lv.meaning}`).join('. ')}.${c.lim.series === 'm100' && S.series !== 'm100' ? ' <b>These limits apply to the 100 m sliding mean: choose it as the points of the chart.</b>' : ''}</p>
<p><b>Stretches, not points.</b> A fault is a stretch, so the page can average the points over 1, 2 or 5 m and drops flagged stretches shorter than the chosen minimum. The point-to-point noise of the raw series is ${fmt(pointNoise(P.base), d + 1)} ${u}; a point of this chart ${c.nPer > 1 ? `averages ${c.nPer} of them, so its own noise is about ${fmt(c.noise, d + 1)} ${u}` : 'carries all of it'}. A single point a little past a limit may therefore be noise; a stretch of many points cannot be.</p>
<p><b>This run.</b> Mean ${fmt(c.mean, d)} ${u}, scatter ± ${fmt(c.sd, d)} ${u}, from ${fmt(c.dmin, d)} to ${fmt(c.dmax, d)} ${u}. ${c.nOutside ? (c.levels.length > 1 ? `Points beyond each level of ${c.lim.name}: ` + c.levels.map((lv, j) => `${lv.name} ${c.levelCount[j]}`).join(', ') + '.' : `${c.nOutside} points lie outside the ${c.lim.name} limits.`) : `No point lies outside the ${c.lim.name} limits.`} The scan is one pass; between two passes a positioning error would come on top of what is shown here.</p>
<p class="muted">Data: output/runs/${D.run.id}/. Page made by monitor.py.</p>`;
}

function refresh() {                                              // redraw the active panel (P, S, cur, SFX)
  compute();
  chart(); view3d(); table(); notes();
}
function renderKpis() {                                           // the header tiles of every panel on the tab
  const active = PANELS.map((pn, i) => pn.P ? i : -1).filter(i => i >= 0);
  el('kpis').innerHTML = active.map(i => { let html = ''; withPanel(i, () => { html = kpis(active.length > 1); }); return html; }).join('');
}
PANELS.forEach((pn, i) => {                                       // the menus of each panel act on that panel only
  const E = id => el(id + pn.sfx), change = fn => e => withPanel(i, () => { fn(e); refresh(); renderKpis(); });
  E('cls').onchange = change(e => { S.cls = +e.target.value; const want = P.limits[S.cls].series; if (want && S.series !== want) { S.series = want; E('series').value = want; } });
  E('series').onchange = change(e => { S.series = e.target.value; });
  E('minlen').onchange = change(e => { S.minlen = +e.target.value; });
  E('yscale').onchange = change(e => { S.yscale = e.target.value; });
});

// a tab can be addressed directly: monitor.html#wire (also #wire_height and #wire_stagger)
const ALIAS = {wire_height: 'wire', wire_stagger: 'wire'};
const want0 = typeof location !== 'undefined' && location.hash ? location.hash.slice(1) : '', want = ALIAS[want0] || want0;
showTab(TABS.some(t => t.key === want) ? want : TAB);
</script>
</body>
</html>
